server {
  listen 80;
  server_name meridian-router.nexoratech.com.vn;

  location / {
    proxy_pass http://router:20128;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}

server {
  listen 80;
  server_name meridian.nexoratech.com.vn _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /v1/ {
    proxy_pass http://backend:8000/v1/;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /router-embed/ {
    proxy_pass http://router:20128/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Nexora-Embed "1";
  }

  location ~ ^/(_next/|provider-icons/|favicon\.svg$|favicon\.ico$|manifest\.webmanifest$) {
    proxy_pass http://router:20128;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
